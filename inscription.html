  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">

  <!-- Formulaire -->
  <div class="container my-5">
    <h2 class="text-center mb-4"><i class="bi bi-pencil-square"></i> Formulaire d’inscription</h2>
    <form class="row g-3">
      <div class="col-md-6">
        <label for="nom" class="form-label">Nom</label>
        <input type="text" class="form-control" id="nom" placeholder="Entrez le nom">
      </div>
      <div class="col-md-6">
        <label for="prenom" class="form-label">Prénom</label>
        <input type="text" class="form-control" id="prenom" placeholder="Entrez le prénom">
      </div>
      <div class="col-md-6">
        <label for="dateNaissance" class="form-label">Date de naissance</label>
        <input type="date" class="form-control" id="dateNaissance">
      </div>
      <div class="col-md-6">
        <label for="genre" class="form-label">Genre</label>
        <select class="form-select" id="genre">
          <option selected disabled>Choisir...</option>
          <option>Masculin</option>
          <option>Féminin</option>
        </select>
      </div>
      <div class="col-md-6">
        <label for="classe" class="form-label">Classe demandée</label>
        <select class="form-select" id="classe">
          <option selected disabled>Choisir...</option>
          <option>1ère maternelle</option>
          <option>2ème maternelle</option>
          <option>3ème maternelle</option>
          <option >1ère primaire</option>
          <option >2ème primaire</option>
          <option>3ème primaire</option>
          <option>4ème primaire</option>
          <option>5ème primaire</option>
          <option>6ème primaire</option>
          <option>7ème primaire</option>
          <option>8ème primaire</option>
        </select>
      </div>
      <div class="col-md-6">
        <label for="email" class="form-label">Email du parent</label>
        <input type="email" class="form-control" id="email" placeholder="exemple@domaine.com">
      </div>
      <div class="col-12">
        <label for="adresse" class="form-label">Adresse</label>
        <input type="text" class="form-control" id="adresse" placeholder="Adresse complète">
      </div>
      <div class="col-12 text-center">
        <button type="submit" class="btn btn-success btn-lg"><i class="bi bi-check-circle"></i> Soumettre l’inscription</button>
      </div>
    </form>
  </div>

  <!-- Pied de page -->
  <footer class="bg-dark ">
