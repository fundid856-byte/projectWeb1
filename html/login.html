    .login-box {
      max-width: 400px;
      margin: 80px auto;
      padding: 30px;
      background-color: white;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    @media screen and (max-width:720px){
      footer{
        position: relative;
        top:80px;
      }
    }
  </style>
</head>
<body>

  <!-- Barre de navigation -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
      <a class="navbar-brand" href="index.html"><i class="bi bi-mortarboard-fill"></i> Complexe Scolaire la Foi</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="menu">

  <!-- Formulaire de connexion -->
  <div class="login-box">
    <h3 class="text-center mb-4"><i class="bi bi-person-lock"></i> Connexion administrateur</h3>
    <form>
      <div class="mb-3">
        <label for="identifiant" class="form-label">Nom d'utilisateur</label>
        <input type="text" class="form-control" id="identifiant" placeholder="admin123">
      </div>
      <div class="mb-3">
        <label for="motdepasse" class="form-label">Mot de passe</label>
        <input type="password" class="form-control" id="motdepasse" placeholder="••••••••">
      </div>
      <div class="d-grid">
        <button type="submit" class="btn btn-primary"><i class="bi bi-box-arrow-in-right"></i> Se connecter</button>
      </div>
    </form>
  </div>

  <!-- Pied de page -->
  <footer class="bg-dark ">
    <div class="pied">
        <div class="aligne">
        <h5>Note</h5>
        <p>Ce site web permet aux élèves et parents</p>
        <p>de s'inscrire facilement en ligne</p>
      </div>
      <div class="aligne" id="aligne">
        <h5>Contact</h5>
        <p><i class="bi bi-telephone-fill"></i> +243 89 76 32 124/p>
        <p><i class="bi bi-envelope"></i> lafoi.ecole@gmail.com</p>
      </div>
      <p>&copy; 2026 C.S la Foi. Tous droits réservés.</p>
    </div>
