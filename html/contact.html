<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact - Complexe scolaire la Foi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.13.1/font/bootstrap-icons.min.css">
  
    <link rel="stylesheet" href="../css/index.css">
  <style>
    body {
      background-color: #f0f4f8;
    }
    .contact-box {
      max-width: 700px;
      margin: 60px auto;
      background-color: white;
      border-radius: 12px;
      box-shadow: 0 0 20px rgba(0,0,0,0.08);
      padding: 30px;
    }
    .contact-title {
      text-align: center;
      margin-bottom: 25px;
      color: #0d6efd;
      font-weight: bold;
    }
    label {
      font-weight: 500;
      color: #333;
    }
    .btn-send {
      background-color: #198754;
      border: none;
      font-weight: bold;
    }
    .btn-send:hover {
      background-color: #157347;
    }
  </style>
</head>
<body>

  <!-- Barre de navigation -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
      <a class="navbar-brand" href="index.html"><i class="bi bi-mortarboard-fill"></i> Complexe Scolaire la Foi</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="menu">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="lien" href="index.html">Accueil</a></li>
          <li class="nav-item"><a class="lien" href="inscription.html">Inscription</a></li>
          <li class="nav-item"><a class="lien" href="dashbord.html">Tableau de bord</a></li>
          <li class="nav-item"><a class="lien active" href="contact.html">Contact</a></li>
        </ul>
      </div>
    </div>
  </nav>
  <!-- Formulaire de contact -->
  <div class="contact-box">
    <h3 class="contact-title"><i class="bi bi-envelope-fill"></i> Contactez l’administration</h3>
    <form class="row g-3">
      <div class="col-md-6">
        <label for="nom" class="form-label">Nom</label>
        <input type="text" class="form-control" id="nom" placeholder="Votre nom">
      </div>
      <div class="col-md-6">
        <label for="email" class="form-label">Adresse email</label>
        <input type="email" class="form-control" id="email" placeholder="exemple@domaine.com">
      </div>
      <div class="col-12">
        <label for="sujet" class="form-label">Sujet</label>
        <input type="text" class="form-control" id="sujet" placeholder="Objet de votre message">
      </div>
      <div class="col-12">
        <label for="message" class="form-label">Message</label>
        <textarea class="form-control" id="message" rows="5" placeholder="Votre message ici..."></textarea>
      </div>
      <div class="col-12 text-center mt-4">
        <button type="submit" class="btn btn-send btn-lg"><i class="bi bi-send-fill"></i> Envoyer</button>
      </div>
    </form>
  </div>

  <!-- Pied de page -->
  <footer class="bg-dark ">
    <div class="pied">
        <div class="aligne">
        <h5>Note</h5>
        <p>Ce site web permet aux élèves et parents</p>
        <p>de s'inscrire facilement en ligne</p>
      </div>
      <div class="aligne" id="aligne">
        <h5>Contact</h5>
        <p><i class="bi bi-telephone-fill"></i> +243 89 76 32 124/p>
        <p><i class="bi bi-envelope"></i> lafoi.ecole@gmail.com</p>
      </div>
      <p>&copy; 2026 C.S la Foi. Tous droits réservés.</p>
    </div>
  </footer>


  
</body>
</html>
